<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jyoti, I'm Sorry ❤️</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            #70218e 0%,
            transparent 38%
        ),
        radial-gradient(
            circle at 10% 60%,
            rgba(255, 35, 145, .20),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 75%,
            rgba(110, 65, 255, .22),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #08020e,
            #19051f 45%,
            #030107
        );
}


/* =====================================================
   AMBIENT LIGHT
===================================================== */

body::before,
body::after {

    content: "";

    position: fixed;

    inset: -20%;

    pointer-events: none;

    z-index: -10;
}

body::before {

    background:
        radial-gradient(
            circle,
            rgba(255, 70, 180, .14),
            transparent 25%
        );

    animation:
        ambientMove
        12s
        ease-in-out
        infinite
        alternate;
}

body::after {

    background:
        linear-gradient(
            115deg,
            transparent 35%,
            rgba(255,255,255,.035) 50%,
            transparent 65%
        );

    animation:
        lightSweepBackground
        9s
        linear
        infinite;
}

@keyframes ambientMove {

    from {
        transform:
            translate(-5%, -3%)
            scale(1);
    }

    to {
        transform:
            translate(5%, 4%)
            scale(1.2);
    }
}

@keyframes lightSweepBackground {

    from {
        transform:
            translateX(-35%)
            rotate(5deg);
    }

    to {
        transform:
            translateX(35%)
            rotate(5deg);
    }
}


/* =====================================================
   STARS
===================================================== */

#stars {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}

.star {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 18px #ff8ad0;

    animation:
        twinkle
        ease-in-out
        infinite;
}

@keyframes twinkle {

    0%,
    100% {
        opacity: .15;
        transform: scale(.6);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* =====================================================
   FLOATING TEXT
===================================================== */

#floatingText {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 2;
}

.float-message {

    position: absolute;

    white-space: nowrap;

    color:
        rgba(255, 210, 235, .16);

    font-weight: bold;

    font-size:
        clamp(14px, 2vw, 22px);

    text-shadow:
        0 0 15px
        rgba(255,60,170,.4);

    animation:
        floatAcross
        linear
        forwards;
}

@keyframes floatAcross {

    from {

        transform:
            translateX(110vw)
            translateY(0)
            rotate(-4deg);

        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    90% {
        opacity: .8;
    }

    to {

        transform:
            translateX(-130vw)
            translateY(-80px)
            rotate(4deg);

        opacity: 0;
    }
}


/* =====================================================
   FLOATING HEARTS
===================================================== */

#hearts {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 3;
}

.floating-heart {

    position: absolute;

    bottom: -60px;

    animation:
        heartRise
        linear
        forwards;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,70,170,.7)
        );
}

@keyframes heartRise {

    0% {

        transform:
            translateY(0)
            rotate(0deg)
            scale(.6);

        opacity: 0;
    }

    10% {
        opacity: .9;
    }

    100% {

        transform:
            translateY(-115vh)
            translateX(var(--drift))
            rotate(360deg)
            scale(1.2);

        opacity: 0;
    }
}


/* =====================================================
   SCREENS
===================================================== */

.screen {

    display: none;

    position: relative;

    z-index: 10;

    min-height: 100vh;

    width: 100%;

    padding: 25px 15px;

    justify-content: center;

    align-items: center;

    text-align: center;
}

.screen.active {

    display: flex;

    animation:
        screenIn
        .8s
        ease
        both;
}

@keyframes screenIn {

    from {

        opacity: 0;

        transform:
            scale(.97)
            translateY(15px);
    }

    to {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}


/* =====================================================
   CARD
===================================================== */

.card {

    width:
        min(92vw, 680px);

    padding:
        42px 28px;

    border-radius:
        30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    box-shadow:

        0 30px 100px
        rgba(0,0,0,.55),

        inset 0 0 40px
        rgba(255,255,255,.025),

        0 0 50px
        rgba(255,50,170,.08);
}


/* =====================================================
   TEXT
===================================================== */

h1 {

    font-size:
        clamp(32px, 8vw, 58px);

    line-height:
        1.12;

    margin-bottom:
        22px;

    background:
        linear-gradient(
            120deg,
            #fff,
            #ffb5da,
            #d39cff,
            #fff
        );

    background-size:
        250% auto;

    -webkit-background-clip:
        text;

    -webkit-text-fill-color:
        transparent;

    animation:
        textGlow
        5s
        linear
        infinite;
}

@keyframes textGlow {

    to {
        background-position:
            250% center;
    }
}

p {

    font-size:
        17px;

    line-height:
        1.8;

    color:
        rgba(255,255,255,.88);
}


/* =====================================================
   BUTTON
===================================================== */

button,
.surprise-button {

    display:
        inline-block;

    margin-top:
        27px;

    padding:
        15px 30px;

    border:
        0;

    border-radius:
        999px;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            #ff4fa3,
            #a56bff
        );

    font-size:
        16px;

    font-weight:
        bold;

    cursor:
        pointer;

    text-decoration:
        none;

    box-shadow:

        0 10px 35px
        rgba(255,50,160,.3),

        inset 0 1px
        rgba(255,255,255,.35);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

button:hover,
.surprise-button:hover {

    transform:
        translateY(-4px)
        scale(1.04);

    box-shadow:

        0 18px 50px
        rgba(255,50,160,.5);
}

button:active {
    transform: scale(.97);
}


/* =====================================================
   INPUT
===================================================== */

input {

    width:
        min(90%, 400px);

    margin-top:
        18px;

    padding:
        16px 20px;

    border-radius:
        999px;

    border:
        1px solid
        rgba(255,255,255,.2);

    outline:
        none;

    color:
        white;

    background:
        rgba(255,255,255,.08);

    text-align:
        center;

    font-size:
        16px;
}

input::placeholder {
    color:
        rgba(255,255,255,.55);
}

input:focus {

    border-color:
        #ff73b7;

    box-shadow:
        0 0 25px
        rgba(255,80,170,.18);
}

.error {

    min-height:
        20px;

    margin-top:
        14px;

    color:
        #ff9bc7;
}


/* =====================================================
   BIG HEART
===================================================== */

.big-heart {

    font-size:
        85px;

    margin-bottom:
        20px;

    animation:
        heartbeat
        1.4s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            0 0 25px
            rgba(255,50,160,.8)
        );
}

@keyframes heartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.16);
    }
}


/* =====================================================
   COUNTDOWN
===================================================== */

#countdown {

    margin-top:
        15px;

    font-size:
        clamp(80px, 22vw, 160px);

    font-weight:
        bold;

    background:
        linear-gradient(
            135deg,
            #ff67b4,
            #c28aff,
            #fff
        );

    -webkit-background-clip:
        text;

    -webkit-text-fill-color:
        transparent;

    animation:
        countPulse
        1s
        infinite;
}

@keyframes countPulse {

    50% {
        transform:
            scale(1.15);
    }
}


/* =====================================================
   STORY
===================================================== */

.story-wrapper {

    width:
        min(94vw, 950px);
}

.story-card {

    position:
        relative;

    overflow:
        hidden;

    border-radius:
        32px;

    padding:
        10px;

    background:
        linear-gradient(
            135deg,
            #ff62b1,
            #a76cff,
            #ffcaea,
            #6e55ff
        );

    background-size:
        300% 300%;

    animation:
        frameGradient
        5s
        ease
        infinite;

    box-shadow:

        0 30px 100px
        rgba(0,0,0,.65),

        0 0 45px
        rgba(255,60,180,.2);
}

@keyframes frameGradient {

    0% {
        background-position:
            0% 50%;
    }

    50% {
        background-position:
            100% 50%;
    }

    100% {
        background-position:
            0% 50%;
    }
}


/* =====================================================
   PHOTO STAGE
===================================================== */

.photo-stage {

    position:
        relative;

    width:
        100%;

    height:
        min(68vh, 700px);

    overflow:
        hidden;

    border-radius:
        25px;

    background:
        radial-gradient(
            circle,
            #321039,
            #08020d 70%
        );

    perspective:
        1400px;

    transform-style:
        preserve-3d;
}

.photo-inner {

    overflow:
        hidden;

    border-radius:
        24px;

    background:
        #050208;

    position:
        relative;
}


/* =====================================================
   PHOTOS
===================================================== */

.story-photo {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    object-fit:
        contain;

    background:
        #030106;

    border-radius:
        20px;

    transform-style:
        preserve-3d;

    backface-visibility:
        hidden;

    -webkit-backface-visibility:
        hidden;
}

.old-photo {
    z-index: 1;
}

.current-photo {
    z-index: 2;
}


/* =====================================================
   PHOTO GLOW
===================================================== */

.photo-glow {

    position:
        absolute;

    inset:
        10%;

    background:
        radial-gradient(
            circle,
            rgba(255,70,180,.55),
            transparent 65%
        );

    filter:
        blur(45px);

    opacity:
        .55;

    z-index:
        0;

    animation:
        glowPulse
        3s
        ease-in-out
        infinite;
}

@keyframes glowPulse {

    0%,
    100% {

        transform:
            scale(.9);

        opacity:
            .35;
    }

    50% {

        transform:
            scale(1.15);

        opacity:
            .75;
    }
}


/* =====================================================
   REELS FLIP
===================================================== */

.photo-enter {

    animation:
        reelsEnter
        1.25s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

@keyframes reelsEnter {

    0% {

        opacity:
            0;

        transform:
            translate3d(100%,20%,300px)
            rotateY(-75deg)
            rotateZ(-8deg)
            scale(.75);

        filter:
            blur(18px)
            brightness(1.5);

        clip-path:
            polygon(
                100% 0,
                100% 100%,
                20% 90%,
                0 50%,
                20% 10%
            );
    }

    25% {

        opacity:
            .75;

        transform:
            translate3d(45%,-5%,150px)
            rotateY(-38deg)
            rotateZ(5deg)
            scale(.9);

        filter:
            blur(8px)
            brightness(1.25);
    }

    50% {

        opacity:
            1;

        transform:
            translate3d(-10%,4%,60px)
            rotateY(15deg)
            rotateZ(-3deg)
            scale(1.03);

        filter:
            blur(2px)
            brightness(1.1);
    }

    72% {

        transform:
            translate3d(3%,-2%,20px)
            rotateY(-5deg)
            rotateZ(2deg)
            scale(1.015);

        filter:
            blur(0)
            brightness(1.05);
    }

    100% {

        opacity:
            1;

        transform:
            translate3d(0,0,0)
            rotateY(0)
            rotateZ(0)
            scale(1);

        filter:
            blur(0)
            brightness(1);

        clip-path:
            polygon(
                0 0,
                100% 0,
                100% 100%,
                0 100%
            );
    }
}


/* =====================================================
   OLD PHOTO EXIT
===================================================== */

.photo-exit {

    animation:
        reelsExit
        1.1s
        cubic-bezier(.7,0,.84,0)
        forwards;
}

@keyframes reelsExit {

    0% {

        opacity:
            1;

        transform:
            translate3d(0,0,0)
            rotateY(0)
            scale(1);

        filter:
            blur(0);
    }

    35% {

        transform:
            translate3d(-8%,-4%,0)
            rotateY(10deg)
            rotateZ(-3deg)
            scale(1.02);
    }

    70% {

        opacity:
            .65;

        transform:
            translate3d(-70%,12%,-100px)
            rotateY(55deg)
            rotateZ(-8deg)
            scale(.85);

        filter:
            blur(8px);
    }

    100% {

        opacity:
            0;

        transform:
            translate3d(-120%,30%,-250px)
            rotateY(90deg)
            rotateZ(-15deg)
            scale(.65);

        filter:
            blur(18px);
    }
}


/* =====================================================
   WAVE / CURVE
===================================================== */

.photo-wave {

    animation:
        waveCurve
        1.3s
        cubic-bezier(.22,1,.36,1)
        forwards;
}

@keyframes waveCurve {

    0% {

        transform:
            scale(1.3)
            translateY(70px)
            rotate(-8deg);

        filter:
            blur(15px)
            saturate(1.8);

        clip-path:
            polygon(
                0 15%,
                20% 5%,
                40% 18%,
                60% 3%,
                80% 17%,
                100% 5%,
                100% 100%,
                0 100%
            );
    }

    30% {

        transform:
            scale(1.08)
            translateY(-20px)
            rotate(4deg);

        filter:
            blur(4px)
            saturate(1.4);

        clip-path:
            polygon(
                0 5%,
                20% 20%,
                40% 2%,
                60% 18%,
                80% 3%,
                100% 15%,
                100% 100%,
                0 100%
            );
    }

    65% {

        transform:
            scale(1.03)
            translateY(5px)
            rotate(-2deg);

        filter:
            blur(1px);
    }

    100% {

        transform:
            scale(1)
            translateY(0)
            rotate(0);

        filter:
            blur(0);

        clip-path:
            polygon(
                0 0,
                100% 0,
                100% 100%,
                0 100%
            );
    }
}


/* =====================================================
   PHOTO LIGHT
===================================================== */

.photo-light {

    position:
        absolute;

    top:
        -30%;

    left:
        -70%;

    width:
        45%;

    height:
        160%;

    z-index:
        5;

    pointer-events:
        none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform:
        rotate(15deg);

    animation:
        photoLightSweep
        2.2s
        ease-out
        infinite;
}

@keyframes photoLightSweep {

    0% {
        left:
            -70%;

        opacity:
            0;
    }

    20% {
        opacity:
            1;
    }

    60% {
        opacity:
            .4;
    }

    100% {

        left:
            130%;

        opacity:
            0;
    }
}


/* =====================================================
   SPARKLES
===================================================== */

.photo-sparkle {

    position:
        absolute;

    z-index:
        10;

    color:
        white;

    font-size:
        24px;

    pointer-events:
        none;

    text-shadow:

        0 0 5px white,
        0 0 15px #ff67b5,
        0 0 30px #ff67b5;

    animation:
        sparkleFloat
        2s
        ease-in-out
        infinite;
}

.sparkle1 {
    top:
        12%;
    left:
        8%;
}

.sparkle2 {

    top:
        25%;

    right:
        10%;

    animation-delay:
        .5s;
}

.sparkle3 {

    bottom:
        20%;

    left:
        15%;

    animation-delay:
        1s;
}

@keyframes sparkleFloat {

    0%,
    100% {

        opacity:
            .2;

        transform:
            scale(.6)
            rotate(0);
    }

    50% {

        opacity:
            1;

        transform:
            scale(1.5)
            rotate(180deg);
    }
}


/* =====================================================
   STORY CAPTION
===================================================== */

.story-caption {

    min-height:
        105px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        24px 18px;

    font-size:
        clamp(17px, 3vw, 24px);

    line-height:
        1.6;

    background:
        linear-gradient(
            rgba(16,4,22,.96),
            rgba(16,4,22,.92)
        );

    color:
        #ffe8f5;

    text-shadow:
        0 0 15px
        rgba(255,90,180,.25);
}


/* =====================================================
   PROGRESS
===================================================== */

.progress {

    height:
        6px;

    background:
        rgba(255,255,255,.1);
}

#bar {

    width:
        0;

    height:
        100%;

    background:
        linear-gradient(
            90deg,
            #ff55a8,
            #c077ff,
            #fff
        );

    box-shadow:
        0 0 15px
        #ff63b3;

    transition:
        width .4s ease;
}


/* =====================================================
   LETTER
===================================================== */

.letter-wrapper {

    position:
        relative;

    width:
        min(94vw, 850px);

    margin:
        30px auto;
}

.letter-glow {

    position:
        absolute;

    inset:
        -80px;

    background:
        radial-gradient(
            circle,
            rgba(255,70,175,.22),
            transparent 65%
        );

    filter:
        blur(50px);

    pointer-events:
        none;
}

.letter-card {

    position:
        relative;

    padding:
        clamp(30px,6vw,65px)
        clamp(20px,6vw,65px);

    border-radius:
        30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.2);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:

        0 40px 120px
        rgba(0,0,0,.55),

        inset 0 0 50px
        rgba(255,255,255,.025);

    overflow:
        hidden;
}

.letter-top {

    display:
        flex;

    justify-content:
        space-between;

    gap:
        20px;

    margin-bottom:
        25px;

    color:
        rgba(255,210,235,.65);

    font-size:
        13px;

    letter-spacing:
        1px;
}

.letter-flower {

    font-size:
        65px;

    margin-bottom:
        12px;

    filter:
        drop-shadow(
            0 0 20px
            rgba(255,60,170,.55)
        );

    animation:
        gentleFloat
        3s
        ease-in-out
        infinite;
}

@keyframes gentleFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-2deg);
    }

    50% {
        transform:
            translateY(-8px)
            rotate(2deg);
    }
}

.letter-line {

    width:
        100px;

    height:
        2px;

    margin:
        0 auto 30px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff71b8,
            #bd82ff,
            transparent
        );

    box-shadow:
        0 0 15px
        rgba(255,80,180,.7);
}

.letter-card > p {

    max-width:
        700px;

    margin:
        0 auto 18px;

    color:
        rgba(255,255,255,.88);

    line-height:
        1.9;
}

.letter-opening {

    font-size:
        24px !important;

    color:
        #ffb8da !important;

    font-family:
        Georgia,
        serif;
}

.pink {

    color:
        #ff9dca;

    text-shadow:
        0 0 12px
        rgba(255,80,170,.25);
}


/* =====================================================
   QUOTE
===================================================== */

.quote-note {

    position:
        relative;

    margin:
        35px auto;

    padding:
        30px 35px;

    max-width:
        650px;

    border-radius:
        20px;

    background:
        linear-gradient(
            135deg,
            rgba(255,90,175,.12),
            rgba(155,100,255,.10)
        );

    border:
        1px solid
        rgba(255,150,210,.18);

    color:
        #ffd9ec;

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(18px,3vw,24px);

    font-style:
        italic;

    line-height:
        1.7;

    box-shadow:
        0 15px 50px
        rgba(255,50,160,.08);
}

.quote-mark {

    position:
        absolute;

    left:
        15px;

    top:
        5px;

    font-size:
        55px;

    color:
        rgba(255,100,185,.35);
}

.quote-mark.bottom {

    left:
        auto;

    top:
        auto;

    right:
        15px;

    bottom:
        -15px;
}


/* =====================================================
   PROMISE NOTES
===================================================== */

.promise-notes {

    display:
        grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        20px;

    margin:
        38px auto;
}

.promise-note {

    position:
        relative;

    min-height:
        190px;

    padding:
        28px 22px 22px;

    text-align:
        left;

    border-radius:
        8px;

    color:
        #341629;

    background:
        linear-gradient(
            135deg,
            #fff5fb,
            #ffe5f2
        );

    box-shadow:
        0 18px 40px
        rgba(0,0,0,.25);

    transform:
        rotate(-1.5deg);

    transition:
        transform .3s ease;
}

.promise-note:hover {

    transform:
        rotate(0)
        translateY(-8px)
        scale(1.02);
}

.promise-note:nth-child(even) {

    background:
        linear-gradient(
            135deg,
            #f7edff,
            #eadcff
        );

    transform:
        rotate(1.5deg);
}

.promise-note:nth-child(even):hover {

    transform:
        rotate(0)
        translateY(-8px)
        scale(1.02);
}

.note-one {
    border-top:
        4px solid #ff78b9;
}

.note-two {
    border-top:
        4px solid #ffb36f;
}

.note-three {
    border-top:
        4px solid #a579ff;
}

.note-four {
    border-top:
        4px solid #ff668f;
}

.note-pin {

    position:
        absolute;

    top:
        -16px;

    left:
        50%;

    transform:
        translateX(-50%);

    width:
        35px;

    height:
        35px;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.9);

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.2);
}

.promise-note h3 {

    margin-bottom:
        12px;

    color:
        #6e2452;

    font-size:
        19px;
}

.promise-note p {

    color:
        #70465f;

    font-size:
        14px;

    line-height:
        1.7;
}


/* =====================================================
   HEART DIVIDER
===================================================== */

.heart-divider {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        12px;

    margin:
        38px auto;
}

.heart-divider i {

    display:
        block;

    width:
        55px;

    height:
        1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff70b8,
            transparent
        );
}

.heart-divider span {

    color:
        #ff7fbd;

    text-shadow:
        0 0 15px
        rgba(255,70,175,.7);
}


/* =====================================================
   FINAL NOTE
===================================================== */

.final-note {

    margin:
        35px auto;

    padding:
        28px 24px;

    max-width:
        620px;

    border-radius:
        20px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.12);
}

.final-note-heart {

    font-size:
        48px;

    margin-bottom:
        10px;

    animation:
        heartbeat
        1.5s
        infinite;
}

.final-note p {

    color:
        #ffddeb;

    font-family:
        Georgia,
        serif;

    font-style:
        italic;
}

.signature-text {

    margin-top:
        30px !important;

    font-family:
        Georgia,
        serif;

    font-size:
        23px !important;

    color:
        #ffb5d7 !important;
}

.signature {

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:
        24px !important;

    color:
        rgba(255,255,255,.7) !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    .screen {
        padding:
            15px;
    }

    .card {
        padding:
            32px 19px;

        border-radius:
            25px;
    }

    p {
        font-size:
            15px;
    }

    .photo-stage {

        height:
            62vh;

        min-height:
            360px;

        border-radius:
            20px;
    }

    .story-card {
        padding:
            6px;

        border-radius:
            24px;
    }

    .story-caption {

        min-height:
            110px;

        padding:
            18px 12px;

        font-size:
            17px;
    }

    .letter-card {

        padding:
            30px 18px;
    }

    .letter-top {
        font-size:
            11px;
    }

    .promise-notes {

        grid-template-columns:
            1fr;
    }

    .promise-note,
    .promise-note:nth-child(even) {

        transform:
            rotate(0);
    }

    .quote-note {

        padding:
            28px 24px;

        font-size:
            18px;
    }

    button,
    .surprise-button {

        padding:
            14px 24px;
    }
}

</style>
</head>
